<svg width="256" height="256" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Prism by Xelume</title>
  <desc>A soft, rounded Xelume star shaped by a blue-violet prism facet.</desc>

  <defs>
    <linearGradient id="spectral-body" x1="3.5" y1="6" x2="20.5" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55A0FF"/>
      <stop offset="0.48" stop-color="#626CF7"/>
      <stop offset="1" stop-color="#A85CF5"/>
    </linearGradient>
    <linearGradient id="soft-core" x1="9" y1="5" x2="15" y2="19" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8090FF" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#7058ED" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- The shorter rays and rounded joins retain Xelume without the weapon-like sharpness. -->
  <path
    d="M12 3.6L13.35 8.55L16.45 7.55L15.45 10.65L20.4 12L15.45 13.35L16.45 16.45L13.35 15.45L12 20.4L10.65 15.45L7.55 16.45L8.55 13.35L3.6 12L8.55 10.65L7.55 7.55L10.65 8.55L12 3.6Z"
    fill="url(#spectral-body)"
    stroke="url(#spectral-body)"
    stroke-width="1.05"
    stroke-linejoin="round"
  />
  <path
    d="M12 4.4C12.9 7.6 14.1 10.1 15.65 12C14.1 13.9 12.9 16.4 12 19.6C11.1 16.4 9.9 13.9 8.35 12C9.9 10.1 11.1 7.6 12 4.4Z"
    fill="url(#soft-core)"
  />
</svg>
