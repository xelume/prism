name: Auto Tag Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-tag-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag version change
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create tag when application version changes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          read_version() {
            sed -n 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p'
          }

          version=$(read_version < config/app.xcconfig)
          previous_version=$(git show "${VERIFIED_SHA}^:config/app.xcconfig" 2>/dev/null | read_version || true)
          if [[ "$version" == "$previous_version" ]]; then
            echo "Prism version is unchanged at $version; skipping tag creation."
            exit 0
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Prism version: $version" >&2
            exit 1
          fi

          tag="v${version}"
          existing_sha=$(git rev-list -n 1 "$tag" 2>/dev/null || true)
          if [[ -n "$existing_sha" ]]; then
            if [[ "$existing_sha" == "$VERIFIED_SHA" ]]; then
              echo "$tag already points to the verified commit; nothing to do."
              exit 0
            fi
            echo "$tag already points to $existing_sha; refusing to overwrite it." >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" "$VERIFIED_SHA" -m "Release $tag"
          git push origin "refs/tags/$tag"

          GH_TOKEN="$GITHUB_TOKEN" gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$tag"
