name: Release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package and draft release
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate version before building
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          plutil -lint info.plist
          test "$(uname -m)" = arm64
          bash scripts/packageRelease.sh "$RELEASE_TAG" --check-only
      - name: Test without real accounts
        run: bash scripts/test.sh
      - name: Build and verify ad-hoc signature
        run: bash scripts/build.sh
      - name: Package release assets
        run: bash scripts/packageRelease.sh "$RELEASE_TAG"
      - name: Preserve release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prism-${{ github.ref_name }}-macos-arm64
          path: |
            build/release/*.dmg
            build/release/SHA256SUMS.txt
            build/release/releaseNotes.md
          if-no-files-found: error
          retention-days: 14
      - name: Create draft (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft \
            --title "Xelume Switch $RELEASE_TAG (macOS arm64, not notarized)" \
            --notes-file build/release/releaseNotes.md \
            build/release/*.dmg build/release/SHA256SUMS.txt
