name: Release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package and draft release
    runs-on: macos-26
    timeout-minutes: 25
    environment: release-signing
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve locked Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies -project Prism.xcodeproj -scheme Prism
          -clonedSourcePackagesDirPath build/SourcePackages
          -onlyUsePackageVersionsFromResolvedFile
      - name: Validate version before building
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          plutil -lint info.plist
          test "$(uname -m)" = arm64
          bash scripts/packageRelease.sh "$RELEASE_TAG" --check-only
      - name: Test update publication boundaries
        run: python3 tests/updateFeedTests.py
      - name: Run hostless XCTest suite
        run: >-
          xcodebuild -project Prism.xcodeproj -scheme Prism
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/DerivedData
          -clonedSourcePackagesDirPath build/SourcePackages -disableAutomaticPackageResolution
          -resultBundlePath build/TestResults.xcresult test
      - name: Archive application with Xcode
        run: >-
          xcodebuild -project Prism.xcodeproj -scheme Prism
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData
          -clonedSourcePackagesDirPath build/SourcePackages -disableAutomaticPackageResolution
          -archivePath build/Prism.xcarchive ARCHS=arm64 archive
      - name: Preserve XCTest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
      - name: Package and sign update assets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/packageRelease.sh "$RELEASE_TAG" --signed
      - name: Preserve release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prism-${{ github.ref_name }}-macos-arm64
          path: |
            build/release/*.dmg
            build/release/SHA256SUMS.txt
            build/release/releaseNotes.md
            build/release/appcast.xml
          if-no-files-found: error
          retention-days: 14
      - name: Create draft (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft \
            --title "Prism $RELEASE_TAG (macOS arm64, not notarized)" \
            --notes-file build/release/releaseNotes.md \
            build/release/*.dmg build/release/SHA256SUMS.txt build/release/appcast.xml
