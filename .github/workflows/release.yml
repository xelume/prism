name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package and publish release
    runs-on: macos-26
    timeout-minutes: 25
    environment: release-signing
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Resolve release commit
        id: releaseCommit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.releaseCommit.outputs.sha }}
        run: |
          successful_sha=$(gh run list --workflow CI --commit "$RELEASE_SHA" --event push \
            --status success --limit 1 --json headSha \
            --jq '.[0].headSha // ""')
          if [[ "$successful_sha" != "$RELEASE_SHA" ]]; then
            echo "No successful CI push run found for tagged commit $RELEASE_SHA." >&2
            exit 1
          fi
      - name: Resolve locked Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies -project Prism.xcodeproj -scheme Prism
          -clonedSourcePackagesDirPath build/SourcePackages
          -onlyUsePackageVersionsFromResolvedFile
      - name: Validate version before building
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          plutil -lint info.plist
          test "$(uname -m)" = arm64
          bash scripts/packageRelease.sh "$RELEASE_TAG" --check-only
      - name: Archive application with Xcode
        run: >-
          xcodebuild -project Prism.xcodeproj -scheme Prism
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData
          -clonedSourcePackagesDirPath build/SourcePackages -disableAutomaticPackageResolution
          -archivePath build/Prism.xcarchive ARCHS=arm64 archive
      - name: Package and sign update assets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/packageRelease.sh "$RELEASE_TAG" --signed
      - name: Preserve release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prism-${{ inputs.release_tag || github.ref_name }}-macos-arm64
          path: |
            build/release/*.dmg
            build/release/SHA256SUMS.txt
            build/release/releaseNotes.md
            build/release/appcast.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload complete release assets (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft \
            --title "Prism $RELEASE_TAG (macOS arm64, not notarized)" \
            --notes-file build/release/releaseNotes.md \
            build/release/*.dmg build/release/SHA256SUMS.txt build/release/appcast.xml
      - name: Publish uploaded release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  publishFeed:
    name: Publish update feed
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/updateFeed.yml
