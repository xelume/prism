name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify macOS arm64
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check scripts and application metadata
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          plutil -lint info.plist
          test "$(uname -m)" = arm64
          xcrun swiftc --version
      - name: Test without real accounts
        run: bash scripts/test.sh
      - name: Build and verify ad-hoc signature
        run: bash scripts/build.sh
      - name: Package versioned DMG
        run: bash scripts/packageRelease.sh
      - name: Save build for testing (not notarized)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prism-macos-arm64-${{ github.sha }}
          path: |
            build/release/*.dmg
            build/release/SHA256SUMS.txt
            build/release/releaseNotes.md
          if-no-files-found: error
          retention-days: 14
